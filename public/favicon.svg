<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="50" cy="50" r="45" fill="url(#grad1)" stroke="#fff" stroke-width="2"/>
  
  <!-- 导航图标 -->
  <g fill="white">
    <!-- 指南针外圈 -->
    <circle cx="50" cy="50" r="30" fill="none" stroke="white" stroke-width="2"/>
    
    <!-- 指南针指针 -->
    <polygon points="50,25 55,45 50,50 45,45" fill="#ff6b6b"/>
    <polygon points="50,75 45,55 50,50 55,55" fill="white"/>
    
    <!-- 中心点 -->
    <circle cx="50" cy="50" r="3" fill="white"/>
    
    <!-- 方向标记 -->
    <text x="50" y="20" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold">N</text>
  </g>
</svg>